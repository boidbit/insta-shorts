name: Golden frames (2d stays 2d)

# Guards the two looks:
#  1. compare-base (blocking): renders the 2d frames with the desi-toons-studio code AND with this code on the
#     same runner. They must be pixel-identical, so 2.5D work can never change the normal look.
#  2. check (informational): compares 2d and 2.5d frames with the PNGs committed in tests/golden/.
on:
  pull_request:
  push:
    paths:
      - "studio/**"
      - "tests/**"
      - "scripts/**"
      - "scenes/**"
      - ".github/workflows/golden.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch with the reference 2d look"
        required: false
        default: "desi-toons-studio"

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the reference 2d code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || 'desi-toons-studio' }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (fonts, emoji)
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=180"
          PKGS="ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-liberation libraqm0"
          for try in 1 2 3; do
            if timeout 180 sudo apt-get $APT update -y && timeout 420 sudo apt-get $APT install -y $PKGS; then
              break
            fi
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed (network?), retrying in 20 s"
            sleep 20
          done

      - name: Python packages
        run: pip install -r requirements.txt

      - name: 2d must be pixel-identical to the reference code
        run: python tests/golden.py compare-base --base base

      - name: Compare with committed golden frames (informational)
        continue-on-error: true
        run: python tests/golden.py check

      - name: Upload diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/out/*_DIFF.png
          if-no-files-found: ignore
