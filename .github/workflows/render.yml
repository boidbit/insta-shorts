name: Render video
run-name: ${{ inputs.request_id && format('web-{0}', inputs.request_id) || format('Render video ({0})', github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "AI director: idea (empty + count = AI picks topics). Needs GEMINI_API_KEY or ANTHROPIC_API_KEY secret."
        required: false
        default: ""
      hook:
        description: "Hook style for AI videos"
        type: choice
        options: [auto, pattern_interrupt, pov, relatable, curiosity, list, question, cold_open, expectation]
        default: auto
      count:
        description: "AI: how many different videos (1-5)"
        required: false
        default: "1"
      script:
        description: "Or a script file, e.g. scripts/doodh_story.txt (no AI needed)"
        required: false
        default: ""
      script_text:
        description: "Or the script itself (used by the web page)"
        required: false
        default: ""
      ai_polish:
        description: "Script: let the AI add Devanagari + acting (needs an AI key)"
        type: boolean
        required: false
        default: false
      scene:
        description: "Or a scene file, e.g. scenes/doodh_story_demo.json (or 'all')"
        required: false
        default: "scenes/doodh_story_demo.json"
      width:
        description: "Output width in px (1080 = full HD reel, 720 = faster)"
        required: false
        default: "1080"
      voice:
        description: "Generate Hindi voice (edge-tts)?"
        type: boolean
        required: false
        default: true
      request_id:
        description: "Set by the web page to find this run (leave empty)"
        required: false
        default: ""
  push:
    paths:
      - "scenes/*.json"
      - "scripts/*.txt"

permissions:
  contents: write     # publish each finished reel as a GitHub release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts, emoji)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-liberation libraqm0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Cache generated voice lines
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Write the story
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INSTRUCTION: ${{ inputs.instruction }}
          HOOK: ${{ inputs.hook }}
          COUNT: ${{ inputs.count }}
          SCRIPT: ${{ inputs.script }}
          SCRIPT_TEXT: ${{ inputs.script_text }}
          AI_POLISH: ${{ inputs.ai_polish }}
          SCENE: ${{ inputs.scene }}
          BEFORE: ${{ github.event.before }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p scenes/generated
          LIST=""
          HAVE_AI=""
          [ -n "$ANTHROPIC_API_KEY$GEMINI_API_KEY$GOOGLE_API_KEY" ] && HAVE_AI=1
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$SCRIPT_TEXT" ]; then
              printf '%s\n' "$SCRIPT_TEXT" > scenes/generated/web_script.txt
              if [ "$AI_POLISH" = "true" ] && [ -n "$HAVE_AI" ]; then
                LIST="$(python -m studio.director "$SCRIPT_TEXT" --hook "${HOOK:-auto}" -o scenes/generated/web.json)"
              else
                python -m studio.script scenes/generated/web_script.txt -o scenes/generated/web.json
                LIST="scenes/generated/web.json"
              fi
            elif [ -n "$SCRIPT" ]; then
              python -m studio.script "$SCRIPT" -o scenes/generated/script.json
              LIST="scenes/generated/script.json"
            elif [ -n "$INSTRUCTION" ] || [ "${COUNT:-1}" != "1" ]; then
              [ -z "$HAVE_AI" ] && { echo "::error::No AI key secret (GEMINI_API_KEY / ANTHROPIC_API_KEY)"; exit 1; }
              N=$(( ${COUNT:-1} > 5 ? 5 : ${COUNT:-1} ))
              LIST="$(python -m studio.director "$INSTRUCTION" --hook "${HOOK:-auto}" --count "$N" -o scenes/generated/ai.json)"
            elif [ "$SCENE" = "all" ]; then LIST="$(ls scenes/*.json)"
            else LIST="$SCENE"; fi
          else
            CHANGED="$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            [ -z "$CHANGED" ] && CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            # first push / new branch: nothing to diff against -> render every scene
            [ -z "$CHANGED" ] && CHANGED="$(ls scenes/*.json)"
            for f in $CHANGED; do
              case "$f" in
                *.txt) out="scenes/generated/$(basename "$f" .txt).json"; python -m studio.script "$f" -o "$out"; LIST="$LIST $out" ;;
                *) LIST="$LIST $f" ;;
              esac
            done
          fi
          echo "Scenes: $LIST"
          { echo "list<<EOF"; echo "$LIST"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Render
        env:
          LIST: ${{ steps.pick.outputs.list }}
          WIDTH: ${{ inputs.width || '1080' }}
          VOICE: ${{ inputs.voice }}
        run: |
          mkdir -p out
          FLAGS=""
          [ "$VOICE" = "false" ] && FLAGS="--no-tts"
          for f in $LIST; do
            name=$(basename "$f" .json)
            python -m studio.render "$f" -o "out/$name.mp4" --width "$WIDTH" $FLAGS
            python -m studio.render "$f" --frame 1.0 -o "out/$name.png" --width 540 $FLAGS
            [ -f "${f%.json}.post.txt" ] && cp "${f%.json}.post.txt" "out/$name.post.txt"
            echo "- \`$name.mp4\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            out/*.mp4
            out/*.png
            out/*.post.txt
            scenes/generated/*.json
          if-no-files-found: error

      - name: Publish as release (the web page plays it from here)
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.pick.outputs.list }}
          TAG: reel-${{ inputs.request_id || github.run_id }}
        run: |
          shopt -s nullglob
          files=(out/*.mp4 out/*.png out/*.post.txt)
          first=$(echo $LIST | awk '{print $1}')
          TITLE="$(python -c 'import sys; from studio.util import load_scene; s = load_scene(sys.argv[1]); print(s.get("hook") or s.get("vars", {}).get("hook") or "Reel")' "$first")"
          cat out/*.post.txt > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "$TITLE" > notes.md
          gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
