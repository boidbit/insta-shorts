name: Render video
run-name: ${{ inputs.request_id && format('web-{0}-{1}', inputs.stage, inputs.request_id) || format('Render video ({0})', github.event_name) }}

# Two stages:
#   stage=script  AI writes a readable script only (~1 min) and publishes it as a
#                 pre-release "draft-<id>" for a human to read / edit / approve.
#   stage=video   renders a video (from script_text, an AI idea, or a file) and
#                 publishes it as release "reel-<id>".
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "script = AI writes a script for approval, video = make the video"
        type: choice
        options: [video, script]
        default: video
      instruction:
        description: "Idea for the AI (empty + count = AI picks topics). Needs an AI key secret."
        required: false
        default: ""
      script_text:
        description: "The script itself (stage=video: render it; stage=script: AI improves it)"
        required: false
        default: ""
      hook:
        description: "Hook style for AI"
        type: choice
        options: [auto, pattern_interrupt, pov, relatable, curiosity, list, question, cold_open, expectation]
        default: auto
      tone:
        description: "Tone for AI: light | dark | satire | absurd | twist (auto = what fits the idea)"
        type: choice
        options: [auto, light, dark, satire, absurd, twist]
        default: auto
      count:
        description: "AI straight to video: how many different videos (1-5)"
        required: false
        default: "1"
      file:
        description: "Or a file: scripts/x.txt or scenes/x.json (or 'all' scenes)"
        required: false
        default: "scenes/doodh_story_demo.json"
      width:
        description: "Output width in px (1080 = full HD reel, 720 = faster)"
        required: false
        default: "1080"
      voice:
        description: "Generate Hindi voice?"
        type: boolean
        required: false
        default: true
      tts:
        description: "Voice engine: auto (Gemini if GEMINI_API_KEY secret is set, else edge-tts) | gemini | edge"
        type: choice
        options: [auto, gemini, edge]
        required: false
        default: auto
      dialogue:
        description: "Spoken words: bubble | subtitle (at the bottom) | both | none (voice only)"
        type: choice
        options: [bubble, subtitle, both, none]
        required: false
        default: bubble
      intro:
        description: "Hook card: over (with the first line) | first (hook card, then the story) | off"
        type: choice
        options: [over, first, off]
        required: false
        default: over
      request_id:
        description: "Set by the web page to find this run (leave empty)"
        required: false
        default: ""
      draft_id:
        description: "Set by the web page: approved draft to clean up (leave empty)"
        required: false
        default: ""
  push:
    paths:
      - "scenes/*.json"
      - "scripts/*.txt"

permissions:
  contents: write     # publish drafts / finished reels as GitHub releases

env:
  # AI key: any of these repository secrets (or variables) works.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || vars.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_AI_KEY || vars.GEMINI_API_KEY }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.API_KEY || secrets.AI_KEY }}
  STAGE: ${{ inputs.stage || 'video' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts, emoji)
        if: env.STAGE != 'script'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-liberation libraqm0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Tests
        if: env.STAGE != 'script'
        run: python -m unittest discover -s tests

      - name: Cache generated voice lines
        if: env.STAGE != 'script'
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Write the story
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INSTRUCTION: ${{ inputs.instruction }}
          SCRIPT_TEXT: ${{ inputs.script_text }}
          HOOK: ${{ inputs.hook }}
          TONE: ${{ inputs.tone }}
          COUNT: ${{ inputs.count }}
          FILE: ${{ inputs.file }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p scenes/generated
          need_ai() {
            PROVIDER="$(python -c 'from studio.director import provider_name; print(provider_name() or "")')"
            if [ -z "$PROVIDER" ]; then
              echo "::error title=AI key nahi mili::Repo -> Settings -> Secrets and variables -> Actions -> Repository secrets -> New repository secret. Name: GEMINI_API_KEY (ya ANTHROPIC_API_KEY), Value: aapki key. Environment (github-pages), Codespaces ya Dependabot secrets yahan nahi milte."
              exit 1
            fi
            echo "AI: $PROVIDER"
          }
          LIST=""
          if [ "$STAGE" = "script" ]; then
            need_ai
            TEXT="$SCRIPT_TEXT"; [ -z "$TEXT" ] && TEXT="$INSTRUCTION"
            python -m studio.director --script-only "$TEXT" --hook "${HOOK:-auto}" --tone "${TONE:-auto}" -o scenes/generated/draft.txt
            cat scenes/generated/draft.txt
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$SCRIPT_TEXT" ]; then
              printf '%s\n' "$SCRIPT_TEXT" > scenes/generated/web_script.txt
              python -m studio.script scenes/generated/web_script.txt -o scenes/generated/web.json
              LIST="scenes/generated/web.json"
            elif [ -n "$INSTRUCTION" ] || [ "${COUNT:-1}" != "1" ]; then
              need_ai
              N=$(( ${COUNT:-1} > 5 ? 5 : ${COUNT:-1} ))
              LIST="$(python -m studio.director "$INSTRUCTION" --hook "${HOOK:-auto}" --tone "${TONE:-auto}" --count "$N" -o scenes/generated/ai.json)"
            elif [ "$FILE" = "all" ]; then
              LIST="$(ls scenes/*.json)"
            elif [ "${FILE##*.}" = "txt" ]; then
              out="scenes/generated/$(basename "$FILE" .txt).json"
              python -m studio.script "$FILE" -o "$out"
              LIST="$out"
            else
              LIST="$FILE"
            fi
          else
            CHANGED="$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            [ -z "$CHANGED" ] && CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            # first push / new branch: nothing to diff against -> render every scene
            [ -z "$CHANGED" ] && CHANGED="$(ls scenes/*.json)"
            for f in $CHANGED; do
              case "$f" in
                *.txt) out="scenes/generated/$(basename "$f" .txt).json"; python -m studio.script "$f" -o "$out"; LIST="$LIST $out" ;;
                *) LIST="$LIST $f" ;;
              esac
            done
          fi
          echo "Scenes: $LIST"
          { echo "list<<EOF"; echo "$LIST"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Publish draft script
        if: env.STAGE == 'script'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: draft-${{ inputs.request_id || github.run_id }}
        run: |
          TITLE="$(sed -n 's/^HOOK:[[:space:]]*//Ip' scenes/generated/draft.txt | head -1)"
          gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Draft: ${TITLE:-script}" --notes-file scenes/generated/draft.txt
          echo "Draft: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Render
        if: env.STAGE != 'script'
        env:
          LIST: ${{ steps.pick.outputs.list }}
          WIDTH: ${{ inputs.width || '1080' }}
          VOICE: ${{ inputs.voice }}
          TTS: ${{ inputs.tts || 'auto' }}      # GEMINI_API_KEY comes from the workflow-level env
          DIALOGUE: ${{ inputs.dialogue || 'bubble' }}
          INTRO: ${{ inputs.intro || 'over' }}
        run: |
          mkdir -p out
          FLAGS="--tts $TTS"
          [ "$VOICE" = "false" ] && FLAGS="--no-tts"
          FLAGS="$FLAGS --dialogue $DIALOGUE --hook $INTRO"
          for f in $LIST; do
            name=$(basename "$f" .json)
            python -m studio.render "$f" -o "out/$name.mp4" --width "$WIDTH" $FLAGS
            python -m studio.render "$f" --frame 1.0 -o "out/$name.png" --width 540 $FLAGS
            [ -f "${f%.json}.post.txt" ] && cp "${f%.json}.post.txt" "out/$name.post.txt"
            echo "- \`$name.mp4\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload videos
        if: env.STAGE != 'script'
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            out/*.mp4
            out/*.png
            out/*.post.txt
            scenes/generated/*.json
          if-no-files-found: error

      - name: Publish as release (the web page plays it from here)
        if: env.STAGE != 'script'
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.pick.outputs.list }}
          TAG: reel-${{ inputs.request_id || github.run_id }}
          DRAFT: ${{ inputs.draft_id }}
        run: |
          shopt -s nullglob
          files=(out/*.mp4 out/*.png out/*.post.txt)
          first=$(echo $LIST | awk '{print $1}')
          TITLE="$(python -c 'import sys; from studio.util import load_scene; s = load_scene(sys.argv[1]); print(s.get("hook") or s.get("vars", {}).get("hook") or "Reel")' "$first")"
          cat out/*.post.txt > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "$TITLE" > notes.md
          gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          # the approved draft has done its job
          [ -n "$DRAFT" ] && gh release delete "draft-$DRAFT" --cleanup-tag -y || true
