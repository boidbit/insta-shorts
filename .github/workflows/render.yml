name: Render video

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "AI director: idea (empty + count = AI picks topics). Needs GEMINI_API_KEY or ANTHROPIC_API_KEY secret."
        required: false
        default: ""
      hook:
        description: "Hook style for AI videos"
        type: choice
        options: [auto, pattern_interrupt, pov, relatable, curiosity, list, question, cold_open, expectation]
        default: auto
      count:
        description: "AI: how many different videos (1-5)"
        required: false
        default: "1"
      script:
        description: "Or a script file, e.g. scripts/doodh_story.txt (no AI needed)"
        required: false
        default: ""
      scene:
        description: "Or a scene file, e.g. scenes/doodh_story_demo.json (or 'all')"
        required: false
        default: "scenes/doodh_story_demo.json"
      width:
        description: "Output width in px (1080 = full HD reel, 720 = faster)"
        required: false
        default: "1080"
      voice:
        description: "Generate Hindi voice (edge-tts)?"
        type: boolean
        required: false
        default: true
  push:
    paths:
      - "scenes/*.json"
      - "scripts/*.txt"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts, emoji)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-liberation libraqm0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Cache generated voice lines
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Decide what to render
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INSTRUCTION: ${{ inputs.instruction }}
          HOOK: ${{ inputs.hook }}
          COUNT: ${{ inputs.count }}
          SCRIPT: ${{ inputs.script }}
          SCENE: ${{ inputs.scene }}
          BEFORE: ${{ github.event.before }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p scenes/generated
          LIST=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$SCRIPT" ]; then
              python -m studio.script "$SCRIPT" -o scenes/generated/script.json
              LIST="scenes/generated/script.json"
            elif [ -n "$INSTRUCTION" ] || [ "${COUNT:-1}" != "1" ]; then
              N=$(( ${COUNT:-1} > 5 ? 5 : ${COUNT:-1} ))
              LIST="$(python -m studio.director "$INSTRUCTION" --hook "${HOOK:-auto}" --count "$N" -o scenes/generated/ai.json)"
            elif [ "$SCENE" = "all" ]; then LIST="$(ls scenes/*.json)"
            else LIST="$SCENE"; fi
          else
            CHANGED="$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            [ -z "$CHANGED" ] && CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'scenes/*.json' 'scripts/*.txt' 2>/dev/null || true)"
            # first push / new branch: nothing to diff against -> render every scene
            [ -z "$CHANGED" ] && CHANGED="$(ls scenes/*.json)"
            for f in $CHANGED; do
              case "$f" in
                *.txt) out="scenes/generated/$(basename "$f" .txt).json"; python -m studio.script "$f" -o "$out"; LIST="$LIST $out" ;;
                *) LIST="$LIST $f" ;;
              esac
            done
          fi
          echo "Scenes: $LIST"
          { echo "list<<EOF"; echo "$LIST"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Render
        env:
          LIST: ${{ steps.pick.outputs.list }}
          WIDTH: ${{ inputs.width || '1080' }}
          VOICE: ${{ inputs.voice }}
        run: |
          mkdir -p out
          FLAGS=""
          [ "$VOICE" = "false" ] && FLAGS="--no-tts"
          for f in $LIST; do
            name=$(basename "$f" .json)
            python -m studio.render "$f" -o "out/$name.mp4" --width "$WIDTH" $FLAGS
            python -m studio.render "$f" --frame 1.0 -o "out/$name.png" --width 540 $FLAGS
            [ -f "${f%.json}.post.txt" ] && cp "${f%.json}.post.txt" "out/$name.post.txt"
            echo "- \`$name.mp4\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            out/*.mp4
            out/*.png
            out/*.post.txt
            scenes/generated/*.json
          if-no-files-found: error
